[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mockstack"
description = "An API mocking workhorse"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["mocking", "integration-testing", "testing", "microservices", "api"]
authors = [{ name = "Adam Ever-Hadani", email = "mockstack.contact@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "opentelemetry-distro[otlp]>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/promptromp/mockstack"
Issues = "https://github.com/promptromp/mockstack/issues"

[project.scripts]
mockstack = "mockstack.main:run"

[project.optional-dependencies]
llm = [
    "ollama>=0.6.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.setuptools_scm]
# can be empty if no extra settings are needed, presence enables setuptools-scm

[tool.mypy]
namespace_packages = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: live tests that bind real sockets; run with -m slow",
]
addopts = "-m 'not slow'"

[tool.coverage.run]
# Measure production code only: test modules, including the deselected live tests,
# are not coverage targets.
omit = ["mockstack/tests/*"]

[tool.ruff.lint]
