fail_fast: true
default_language_version:
  python: python3.13
repos:
-   repo: local
    hooks:
    # do not allow commits with files containing certain blacklisted strings
    -   id: dontship
        name: detect blacklisted strings
        exclude: ^.pre-commit-config.yaml
        entry: codeartifact
        language: pygrep
        types: [text]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
    - id: fix-byte-order-marker
    - id: check-case-conflict
    - id: check-json
    - id: check-yaml
      args: [ --unsafe ]
    - id: detect-aws-credentials
      args: [ --allow-missing-credentials ]
    - id: detect-private-key
    - id: end-of-file-fixer
    - id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.7
  hooks:
    # Run the linter.
    - id: ruff
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: local
  hooks:
  # mypy runs from the dev dependency group in uv.lock, exactly as CI runs it: the
  # stricter checks need the real third-party packages installed, which an isolated
  # hook environment would have to duplicate in `additional_dependencies`.
  - id: mypy
    name: mypy
    entry: bash -ec "uv run mypy mockstack"
    language: system
    types: [python]
    pass_filenames: false
  - id: pytest
    name: pytest [with coverage, without slow]
    entry: bash -ec "uv run python -m pytest --cov=mockstack mockstack/tests --cov-fail-under='90' -m 'not slow'"
    language: system
    types: [python]
    pass_filenames: false
