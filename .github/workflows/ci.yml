# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v8.1.0
      with:
        python-version: ${{ matrix.python-version }}
        version: "latest"
    - name: Install ruff
      uses: astral-sh/ruff-action@v4.0.0
      with:
        # Pinned to the ruff-pre-commit rev: new ruff releases add rules to the selected
        # families, which should arrive through a deliberate bump, not a random CI run.
        version: "0.16.7"
    - name: Install the project
      run: uv sync --all-extras --dev
    - name: Run ruff lint and formatting checks
      run: |
        ruff check
        ruff format --check
    - name: Run mypy
      run: |
        uv pip install types-pyyaml
        uv run mypy mockstack
    - name: Run tests
      run: uv run pytest
    - name: Run live tests
      run: uv run pytest -m slow mockstack/tests/live -v
    - name: Check an install without the opentelemetry extra
      # The OpenTelemetry packages are optional: a plain install has none of them and
      # reports how to install them when tracing is turned on.
      timeout-minutes: 5
      run: |
        set -euo pipefail
        uv build --wheel --out-dir "$RUNNER_TEMP/dist"
        uv venv "$RUNNER_TEMP/base"
        uv pip install --python "$RUNNER_TEMP/base/bin/python" "$RUNNER_TEMP"/dist/*.whl
        uv pip list --python "$RUNNER_TEMP/base/bin/python" > "$RUNNER_TEMP/packages.txt"
        grep -q '^mockstack ' "$RUNNER_TEMP/packages.txt"
        if grep -i opentelemetry "$RUNNER_TEMP/packages.txt"; then
          echo "a plain install should not include OpenTelemetry packages"; exit 1
        fi
        cd "$RUNNER_TEMP"
        status=0
        # A server that starts instead of refusing would never exit: timeout fails the check.
        timeout 60 "$RUNNER_TEMP/base/bin/mockstack" --templates-dir . --opentelemetry.enabled 2> error.txt \
          || status=$?
        cat error.txt
        test "$status" = 2
        grep -F "pip install 'mockstack[opentelemetry]'" error.txt
        if grep -F Traceback error.txt; then exit 1; fi

  docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v8.1.0
      with:
        python-version: "3.13"
        version: "latest"
    - name: Build docs strictly
      run: |
        cp README.md docs/
        uvx --with mkdocs-material mkdocs build --strict
