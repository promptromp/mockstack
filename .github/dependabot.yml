# Weekly dependency-update pull requests against main: the GitHub Actions used by the
# workflows and the packages pinned in uv.lock. Minor and patch bumps are grouped into one
# pull request per ecosystem, and typeshed's stub packages into one more, so the CI runs
# (and the reviews) stay few.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # typeshed's stub packages (types-*) put a date in a fourth version part
      # (6.0.12.20260906), which Dependabot counts as neither a minor nor a patch bump.
      # Dependabot gives a dependency to the most specific group it matches, whatever the
      # order here, so minor-and-patch must exclude them: otherwise it claims each stub,
      # leaves its bump out, and the bump gets a pull request of its own.
      type-stubs:
        patterns: ["types-*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["types-*"]
